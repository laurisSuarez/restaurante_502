{% extends 'gestion/base.html' %}

{% block content %}
<h2>Eliminar mesa</h2>
<p>¿Confirma que desea eliminar la <strong>Mesa {{ mesa.numero_mesa }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'mesa_lista' %}">Cancelar</a>
</form>
{% endblock %}
