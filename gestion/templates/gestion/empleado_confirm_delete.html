{% extends 'gestion/base.html' %}

{% block content %}
<h2>Eliminar empleado</h2>
<p>¿Confirma que desea eliminar a <strong>{{ empleado.nombre }}</strong> ({{ empleado.cargo }})?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'empleado_lista' %}">Cancelar</a>
</form>
{% endblock %}
