{% extends 'gestion/base.html' %}

{% block content %}
<h2>Mesas</h2>
<p><a href="{% url 'mesa_crear' %}">Crear mesa</a></p>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Número</th>
            <th>Capacidad</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for mesa in mesas %}
        <tr>
            <td>{{ mesa.id }}</td>
            <td>{{ mesa.numero_mesa }}</td>
            <td>{{ mesa.capacidad }}</td>
            <td>{{ mesa.estado_mesa }}</td>
            <td>
                <a href="{% url 'mesa_editar' mesa.pk %}">Editar</a>
                |
                <a href="{% url 'mesa_eliminar' mesa.pk %}">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No hay mesas registradas.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
